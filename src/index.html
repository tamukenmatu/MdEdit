<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MdEdit - Markdown Viewer & Editor</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="mode-view sidebar-open">
  <!-- App Container -->
  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <!-- Logo Badge (Clickable to show Welcome/Manual) -->
        <button id="btn-brand" class="brand-badge brand-badge-btn" title="ようこそ画面 / マニュアルを表示">
          <svg class="svg-icon svg-icon-accent" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="brand-title">MdEdit</span>
        </button>

        <!-- Sidebar Toggle Button -->
        <button id="btn-toggle-sidebar" class="icon-btn" title="目次サイドバー切替 (Cmd+B)">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>

        <!-- File Info Display -->
        <div class="file-info-container" id="file-info-container">
          <div class="file-meta-row">
            <span id="file-name" class="file-name">Untitled.md</span>
            <span id="save-status-dot" class="save-status-dot saved" title="保存済み"></span>
            <span id="save-status-text" class="save-status-text">保存済み</span>
          </div>
          <div id="file-path" class="file-path" title="ファイルパス">新規ドキュメント</div>
        </div>
      </div>

      <!-- Center: View Mode Segmented Controls & Obsidian Button -->
      <div class="header-center">
        <div class="header-mode-group">
          <div class="segmented-control" role="group" aria-label="表示モード切替">
            <button id="mode-view" class="seg-btn active" data-mode="view" title="閲覧モード (Cmd+E)">
              <svg class="svg-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>View</span>
            </button>
            <button id="mode-edit" class="seg-btn" data-mode="edit" title="編集モード (Cmd+E)">
              <svg class="svg-icon" viewBox="0 0 24 24">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span>Edit</span>
            </button>
            <button id="mode-split" class="seg-btn" data-mode="split" title="2分割プレビュー (Cmd+E)">
              <svg class="svg-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="12" y1="3" x2="12" y2="21"></line>
              </svg>
              <span>Split</span>
            </button>
          </div>

          <button id="btn-obsidian-vault" class="obsidian-badge-btn" title="Obsidian 保管庫 (01KEN) を開く">
            <svg class="svg-icon svg-icon-obsidian" viewBox="0 0 24 24">
              <polygon points="12 2 19 7 17 21 7 21 5 7 12 2"></polygon>
              <polyline points="5 7 12 12 19 7"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
            <span id="vault-btn-label">01KEN</span>
          </button>

          <button id="btn-save-to-vault" class="icon-btn btn-vault-accent" title="Obsidian 保管庫へ保存・移動">
            <svg class="svg-icon svg-icon-obsidian" viewBox="0 0 24 24">
              <polygon points="12 2 19 7 17 21 7 21 5 7 12 2"></polygon>
              <polyline points="5 7 12 12 19 7"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Right: Action Buttons & Statistics -->
      <div class="header-right">
        <!-- Quick Stats -->
        <div class="stats-badge" id="stats-badge" title="ドキュメント統計">
          <span id="stat-words">0 単語</span>
          <span class="stat-divider">/</span>
          <span id="stat-chars">0 文字</span>
          <span class="stat-divider">/</span>
          <span id="stat-lines">1 行</span>
        </div>

        <!-- Action Buttons -->
        <div class="action-group">
          <button id="btn-new" class="icon-btn" title="新規作成 (Cmd+N)">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </button>

          <button id="btn-open" class="icon-btn" title="ファイルを開く (Cmd+O)">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>

          <button id="btn-save" class="icon-btn btn-primary-accent" title="保存 (Cmd+S)">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>

          <button id="btn-reload" class="icon-btn" title="再読み込み (Cmd+R)">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>

          <div class="dropdown-container">
            <button id="btn-more" class="icon-btn" title="その他のアクション">
              <svg class="svg-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="12" cy="5" r="1"></circle>
                <circle cx="12" cy="19" r="1"></circle>
              </svg>
            </button>
            <div id="more-menu" class="dropdown-menu">
              <button id="menu-download-manual" class="menu-item menu-item-highlight">
                <svg class="svg-icon svg-icon-accent" viewBox="0 0 24 24">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>マニュアルをダウンロード</span>
              </button>
              <button id="menu-pin-palette" class="menu-item">
                <svg class="svg-icon svg-icon-check-icon" viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span id="menu-pin-palette-label">パレットを展開固定</span>
              </button>
              <div class="menu-divider"></div>
              <button id="menu-zoom-in" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                <span>拡大 (Cmd +)</span>
              </button>
              <button id="menu-zoom-out" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                <span>縮小 (Cmd -)</span>
              </button>
              <button id="menu-zoom-reset" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="16"></line>
                  <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                <span id="menu-zoom-reset-label">テキスト拡大率リセット (Cmd 0)</span>
              </button>
              <div class="menu-divider"></div>
              <button id="menu-reset-palette-order" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span>パレット順序を初期化</span>
              </button>
              <div class="menu-divider"></div>
              <button id="menu-save-as" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                </svg>
                <span>名前を付けて保存...</span>
              </button>
              <button id="menu-copy-md" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Markdownをコピー (Cmd+Shift+C)</span>
              </button>
              <button id="menu-copy-html" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <span>HTMLとしてコピー</span>
              </button>
              <button id="menu-export-html" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>HTMLファイルに書き出し...</span>
              </button>
              <button id="menu-print-pdf" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <polyline points="6 9 6 2 18 2 18 9"></polyline>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                  <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>印刷 / PDF出力 (Cmd+P)</span>
              </button>
              <button id="menu-check-update" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
                </svg>
                <span>アップデートを確認...</span>
              </button>
              <button id="menu-show-finder" class="menu-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Finderで表示</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="app-main">
      <!-- 2-Tab Sidebar (Vault File Tree & Document TOC) -->
      <aside class="app-sidebar" id="app-sidebar">
        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs">
          <button id="tab-vault" class="sidebar-tab active" data-tab="vault" title="Obsidian 保管庫ファイルツリー">
            <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>保管庫</span>
          </button>
          <button id="tab-toc" class="sidebar-tab" data-tab="toc" title="文書の目次">
            <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>目次</span>
          </button>
        </div>

        <!-- Panel 1: Vault Explorer Panel -->
        <div class="sidebar-panel active" id="panel-vault">
          <div class="vault-header">
            <div class="vault-info">
              <span id="vault-title" class="vault-title">01KEN</span>
              <span id="vault-file-count" class="vault-count">0 ファイル</span>
            </div>
            <div class="vault-actions">
              <button id="btn-change-vault" class="icon-btn-xs" title="保管庫フォルダを変更...">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  <line x1="12" y1="11" x2="12" y2="17"></line>
                  <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
              </button>
              <button id="btn-refresh-vault" class="icon-btn-xs" title="保管庫を更新">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Vault Filter / Search Input -->
          <div class="vault-search-box">
            <svg class="svg-icon svg-icon-sm search-icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="vault-search-input" placeholder="保管庫内を検索..." spellcheck="false" />
          </div>

          <!-- Vault Tree List -->
          <div class="vault-tree-container" id="vault-tree">
            <div class="vault-loading">保管庫を読み込み中...</div>
          </div>
        </div>

        <!-- Panel 2: Table of Contents Panel -->
        <div class="sidebar-panel" id="panel-toc">
          <div class="toc-header">
            <div class="toc-title-row">
              <svg class="svg-icon svg-icon-accent" viewBox="0 0 24 24">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
              <span class="toc-heading">目次</span>
            </div>
            <span id="toc-count" class="toc-count-badge">0 項目</span>
          </div>
          <nav class="toc-nav" id="toc-nav">
            <div class="toc-empty">見出しがありません</div>
          </nav>
        </div>
      </aside>

      <!-- Content Workspace -->
      <div class="content-workspace" id="content-workspace">
        <!-- Editor Pane -->
        <div class="editor-pane" id="editor-pane">
          <!-- Markdown Edit Tool Palette -->
          <aside class="edit-palette" id="edit-palette" title="Markdown 編集パレット">
            <!-- Palette Header with Toggle Button -->
            <div class="palette-header">
              <div class="palette-header-title">
                <svg class="svg-icon svg-icon-sm svg-icon-accent" viewBox="0 0 24 24">
                  <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                  <line x1="7" y1="7" x2="7.01" y2="7"></line>
                </svg>
                <span>編集タグ</span>
              </div>
              <button id="btn-toggle-palette" class="palette-toggle-btn" title="パレット展開 / 折りたたみ">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
            <div class="palette-divider"></div>

            <!-- Headings -->
            <div class="palette-group">
              <button class="palette-btn" draggable="true" data-tool="h1" title="大見出し (# )">
                <span class="palette-btn-text">H1</span>
                <div class="palette-label-group">
                  <span class="palette-label">大見出し</span>
                  <span class="palette-tag">#</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="h2" title="中見出し (## )">
                <span class="palette-btn-text">H2</span>
                <div class="palette-label-group">
                  <span class="palette-label">中見出し</span>
                  <span class="palette-tag">##</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="h3" title="小見出し (### )">
                <span class="palette-btn-text">H3</span>
                <div class="palette-label-group">
                  <span class="palette-label">小見出し</span>
                  <span class="palette-tag">###</span>
                </div>
              </button>
            </div>
            <div class="palette-divider"></div>

            <!-- Text Formatting -->
            <div class="palette-group">
              <button class="palette-btn" draggable="true" data-tool="bold" title="太字 (Cmd+B)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                  <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">太字</span>
                  <span class="palette-tag">**text**</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="italic" title="斜体 (Cmd+I)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <line x1="19" y1="4" x2="10" y2="4"></line>
                  <line x1="14" y1="20" x2="5" y2="20"></line>
                  <line x1="15" y1="4" x2="9" y2="20"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">斜体</span>
                  <span class="palette-tag">*text*</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="strike" title="取り消し線 (~~text~~)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M16 4H9a3 3 0 0 0-2.83 4"></path>
                  <path d="M14 12a4 4 0 0 1 0 8H6"></path>
                  <line x1="4" y1="12" x2="20" y2="12"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">取り消し線</span>
                  <span class="palette-tag">~~text~~</span>
                </div>
              </button>
              <button id="tool-inline-code" class="palette-btn" draggable="true" data-tool="inline-code" title="バッククォート / リンク化防止 (`text`)">
                <span class="palette-btn-text" style="font-size: 15px; font-weight: 700; color: #38bdf8;">`</span>
                <div class="palette-label-group">
                  <span class="palette-label">バッククォート</span>
                  <span class="palette-tag">`text`</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="kbd" title="キーボードキー表示 (<kbd>Cmd</kbd>)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                  <line x1="6" y1="8" x2="8" y2="8"></line>
                  <line x1="10" y1="8" x2="12" y2="8"></line>
                  <line x1="14" y1="8" x2="18" y2="8"></line>
                  <line x1="7" y1="16" x2="17" y2="16"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">キー表示</span>
                  <span class="palette-tag">&lt;kbd&gt;</span>
                </div>
              </button>
            </div>
            <div class="palette-divider"></div>

            <!-- Blocks -->
            <div class="palette-group">
              <button class="palette-btn" draggable="true" data-tool="quote" title="引用 (> )">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path>
                  <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">引用</span>
                  <span class="palette-tag">&gt;</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="code-block" title="コードブロック (```)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                  <line x1="9" y1="9" x2="9.01" y2="9"></line>
                  <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">コード枠</span>
                  <span class="palette-tag">```</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="details" title="折りたたみブロック (<details>)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <polyline points="9 10 12 13 15 10"></polyline>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">折りたたみ</span>
                  <span class="palette-tag">&lt;details&gt;</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="alert-note" title="ノート・情報枠 (> [!NOTE])">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">ノート枠</span>
                  <span class="palette-tag">[!NOTE]</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="divider" title="水平線 (---)">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">区切り線</span>
                  <span class="palette-tag">---</span>
                </div>
              </button>
            </div>
            <div class="palette-divider"></div>

            <!-- Lists -->
            <div class="palette-group">
              <button class="palette-btn" draggable="true" data-tool="bullet-list" title="箇条書きリスト (- )">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">箇条書き</span>
                  <span class="palette-tag">-</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="number-list" title="番号付きリスト (1. )">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <line x1="10" y1="6" x2="21" y2="6"></line>
                  <line x1="10" y1="12" x2="21" y2="12"></line>
                  <line x1="10" y1="18" x2="21" y2="18"></line>
                  <path d="M4 6h1v4"></path>
                  <path d="M4 10h2"></path>
                  <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">番号リスト</span>
                  <span class="palette-tag">1.</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="task-list" title="チェックリスト (- [ ] )">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">チェック</span>
                  <span class="palette-tag">- [ ]</span>
                </div>
              </button>
            </div>
            <div class="palette-divider"></div>

            <!-- Inserts -->
            <div class="palette-group">
              <button class="palette-btn" draggable="true" data-tool="table" title="テーブル挿入">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="3" y1="15" x2="21" y2="15"></line>
                  <line x1="9" y1="3" x2="9" y2="21"></line>
                  <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">テーブル</span>
                  <span class="palette-tag">3x3</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="link" title="リンク挿入 ([text](url))">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">リンク</span>
                  <span class="palette-tag">[text](url)</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="image" title="画像挿入 (![alt](url))">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">画像</span>
                  <span class="palette-tag">![alt](url)</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="embed" title="添付・ファイル埋め込み (![[ファイル名]])">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">添付埋込</span>
                  <span class="palette-tag">![[file]]</span>
                </div>
              </button>
              <button class="palette-btn" draggable="true" data-tool="wikilink" title="ノート間リンク ([[ノート名]])">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24">
                  <path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"></path>
                  <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                <div class="palette-label-group">
                  <span class="palette-label">ノートリンク</span>
                  <span class="palette-tag">[[note]]</span>
                </div>
              </button>
            </div>
          </aside>

          <div class="editor-gutter" id="editor-gutter">
            <div class="line-number">1</div>
          </div>
          <div class="editor-area-wrapper">
            <textarea id="markdown-editor" spellcheck="false" placeholder="ここに Markdown を入力..."></textarea>
          </div>
        </div>

        <!-- Preview Pane -->
        <div class="preview-pane" id="preview-pane">
          <div class="markdown-body" id="markdown-preview"></div>
        </div>
      </div>
    </main>

    <!-- Footer Status Bar -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="footer-item" id="footer-cursor-pos">行: 1, 列: 1</span>
        <span class="footer-divider">|</span>
        <span class="footer-item" id="footer-file-encoding">UTF-8</span>
      </div>
      <div class="footer-right">
        <span class="footer-item" id="footer-reading-time">読了目安: 1分未満</span>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Application Script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
